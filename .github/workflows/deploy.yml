name: 🚀 Despliegue Automático por SFTP a Producción (IONOS)

on:
  push:
    branches:
      - main
  workflow_dispatch: # Permite disparar el despliegue manualmente desde GitHub

jobs:
  deploy:
    name: Desplegar archivos por SFTP
    runs-on: ubuntu-latest

    steps:
      - name: 📥 Clonar repositorio
        uses: actions/checkout@v4
        with:
          fetch-depth: 2

      - name: 🔍 Verificar configuración de Secretos
        run: |
          if [ -z "${{ secrets.SFTP_HOST }}" ]; then
            echo "::error::Falta el secreto 'SFTP_HOST' en GitHub Secrets. Por favor, añádelo en Settings -> Secrets and variables -> Actions."
            exit 1
          fi
          if [ -z "${{ secrets.SFTP_USER }}" ]; then
            echo "::error::Falta el secreto 'SFTP_USER' en GitHub Secrets."
            exit 1
          fi
          if [ -z "${{ secrets.SFTP_PASSWORD }}" ]; then
            echo "::error::Falta el secreto 'SFTP_PASSWORD' en GitHub Secrets."
            exit 1
          fi

      - name: ⚙️ Generar archivo .env para Producción
        run: |
          cat << 'EOF' > .env
          APP_NAME="AgroDietario"
          APP_ENV=production
          APP_DEBUG=false
          APP_URL=https://${{ secrets.PROD_DOMAIN || 'tudominio.com' }}

          # Base de Datos Producción (IONOS)
          DB_HOST=${{ secrets.PROD_DB_HOST }}
          DB_PORT=${{ secrets.PROD_DB_PORT || '3306' }}
          DB_NAME=${{ secrets.PROD_DB_NAME }}
          DB_USER=${{ secrets.PROD_DB_USER }}
          DB_PASS=${{ secrets.PROD_DB_PASS }}

          CAPTCHA_DRIVER=local_gd
          UPLOAD_MAX_MB=15
          EOF

      - name: 🚀 Subir archivos a Servidor IONOS por SFTP
        uses: SamKirkland/FTP-Deploy-Action@v4.3.5
        with:
          server: ${{ secrets.SFTP_HOST }}
          username: ${{ secrets.SFTP_USER }}
          password: ${{ secrets.SFTP_PASSWORD }}
          port: ${{ secrets.SFTP_PORT || 22 }}
          server-dir: ${{ secrets.SFTP_TARGET_DIR || './' }}
          protocol: sftp
          exclude: |
            **/.git*
            **/.git*/**
            **/node_modules/**
            .env.example
            database/schema.sql
            README.md
