name: 🚀 Despliegue Automático por SFTP a Producción (IONOS)

on:
  push:
    branches:
      - main
  workflow_dispatch: # Permite disparar el despliegue manualmente desde GitHub

jobs:
  deploy:
    name: Desplegar archivos por SFTP
    runs-on: ubuntu-latest

    steps:
      - name: 📥 Clonar repositorio
        uses: actions/checkout@v4
        with:
          fetch-depth: 2

      - name: 🔍 Diagnóstico y comprobación de credenciales
        run: |
          echo "Comprobando disponibilidad de credenciales SFTP..."
          
          HOST="${{ secrets.SFTP_HOST || vars.SFTP_HOST }}"
          USER="${{ secrets.SFTP_USER || vars.SFTP_USER }}"
          PASS="${{ secrets.SFTP_PASSWORD || vars.SFTP_PASSWORD }}"
          
          if [ -z "$HOST" ]; then
            echo "::error::El campo SFTP_HOST está vacío."
            exit 1
          fi
          
          if [ -z "$USER" ]; then
            echo "::error::El campo SFTP_USER está vacío."
            exit 1
          fi
          
          if [ -z "$PASS" ]; then
            echo "::error::El campo SFTP_PASSWORD está vacío."
            exit 1
          fi
          
          echo "✅ Todos los secretos requeridos están detectados correctamente."

      - name: ⚙️ Generar archivo .env para Producción
        run: |
          cat << EOF > .env
          APP_NAME="AgroDietario"
          APP_ENV=production
          APP_DEBUG=true
          APP_URL=https://www.moratalla-murcia.com/agricultura

          # Base de Datos Producción (IONOS)
          DB_HOST=${{ secrets.PROD_DB_HOST || vars.PROD_DB_HOST || 'db5021806071.hosting-data.io' }}
          DB_PORT=${{ secrets.PROD_DB_PORT || vars.PROD_DB_PORT || '3306' }}
          DB_NAME=${{ secrets.PROD_DB_NAME || vars.PROD_DB_NAME || 'db5021806071' }}
          DB_USER=${{ secrets.PROD_DB_USER || vars.PROD_DB_USER || 'dbu1550776' }}
          DB_PASS=${{ secrets.PROD_DB_PASS || vars.PROD_DB_PASS || 'Tortas01.56196798-Salinas_2026_Fincas' }}

          CAPTCHA_DRIVER=local_gd
          UPLOAD_MAX_MB=15
          EOF

      - name: 🚀 Subir archivos a Servidor IONOS por SFTP
        env:
          HOST: ${{ secrets.SFTP_HOST || vars.SFTP_HOST }}
          USER: ${{ secrets.SFTP_USER || vars.SFTP_USER }}
          PASS: ${{ secrets.SFTP_PASSWORD || vars.SFTP_PASSWORD }}
          PORT: ${{ secrets.SFTP_PORT || vars.SFTP_PORT || 22 }}
          TARGET: ${{ secrets.SFTP_TARGET_DIR || vars.SFTP_TARGET_DIR || 'agricultura' }}
        run: |
          sudo apt-get update -qq && sudo apt-get install -y -qq lftp
          lftp -u "$USER","$PASS" -p "$PORT" "sftp://$HOST" << EOF
          set sftp:auto-confirm yes
          set net:timeout 60
          set net:max-retries 3
          mkdir -p "$TARGET"
          cd "$TARGET"
          mirror --reverse --delete --verbose \
            --exclude-glob .git* \
            --exclude-glob .git*/** \
            --exclude-glob .env.example \
            --exclude-glob README.md \
            ./ ./
          bye
          EOF
